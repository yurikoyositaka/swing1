name: Daily Swing Trade Screener

on:
  schedule:
    - cron: '30 6 * * *'
  workflow_dispatch:

jobs:
  run-screener:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        # ▼ 末尾に beautifulsoup4 を追加しました
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas requests jpholiday xlrd beautifulsoup4

      - name: Run Screener
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python main.py
